[project]
name = "backend"
version = "0.1.0"
description = "HTTP byte-range API for EDF recordings stored in Azure Blob Storage"
requires-python = ">=3.14"
dependencies = [
    "azure-identity>=1.26.0",
    "azure-storage-blob[aio]>=12.31.0",
    "fastapi>=0.141.1",
    "python-dotenv>=1.1.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
